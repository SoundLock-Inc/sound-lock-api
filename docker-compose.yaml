version: "3.8"
services:
  db:
    image: postgres:16.0-alpine
    container_name: sound_lock_db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  app:
    build: .
    container_name: sound_lock_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - SSL_MODE=${SSL_MODE}
      - DB_USER=${DB_USER}
      - ACCESS_TOKEN_SIGNING_KEY=${ACCESS_TOKEN_SIGNING_KEY}
      - REFRESH_TOKEN_SIGNING_KEY=${REFRESH_TOKEN_SIGNING_KEY}
    depends_on:
      - db
volumes:
  postgres_data:
